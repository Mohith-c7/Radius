# Verdict v2 policy for the Radius repository (guide: docs/policy.md).
# Read from the BASE branch only, so a pull request cannot loosen it for itself.
#
# Advisory first (docs/CI_INTEGRATION_GUIDE.md, "Making the Verdict v2 check
