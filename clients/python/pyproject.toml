[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "radius-client"
version = "0.1.0"
description = "Typed, dependency-free Python client for the stable Radius HTTP API (not published)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["radius_client*"]

[tool.setuptools.package-data]
radius_client = ["py.typed"]
