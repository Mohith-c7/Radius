[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "radius"
version = "0.1.0"
description = "AI-native software verification platform."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "PyJWT[crypto]>=2.10.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "tree-sitter>=0.23.2,<0.27",
  "tree-sitter-python>=0.23.2",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-rust>=0.24.2",
  "google-genai>=0.1.0",
  "google-generativeai>=0.8.3",
  "argon2-cffi>=23.1.0",
  "Authlib>=1.4.1",
  "httpx>=0.28.1",
  "email-validator>=2.0.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
observability = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "prometheus-client>=0.21.0",
]
llm = [
  # IN-04 optional LLM provider (Anthropic). Not required for tests or the default (off) path.
  "anthropic>=2.3.0,<3",
]
dev = [
  # Observability libraries are optional at runtime but installed for tests.
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "prometheus-client>=0.21.0",
  "black==26.10.1",
  "import-linter==2.15",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  "tmp",
  ".docker-smoke",
  ".docker-pip-smoke",
  "scripts",
  "benchmarks/fixtures/intent",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
markers = [
  "sandbox_adversarial: hostile payloads that run ONLY inside the hardened sandbox container (needs docker + the sandbox image; select with -m sandbox_adversarial)",
  "prompt_injection: LLM prompt-injection suite (QS-02); deterministic stub models, no network (select with -m prompt_injection)",
]
filterwarnings = [
  "ignore::FutureWarning:google.generativeai.*",
]
pythonpath = [
  "apps/api",
  "apps/api/src",
  "apps/worker/src",
  "packages/analysis/src",
  "packages/confidence/src",
  "packages/graph/src",
  "packages/github/src",
  "packages/intent/src",
  "packages/parser/src",
  "packages/repository/src",
  "packages/shared/src",
  "packages/testing/src",
]
testpaths = [
  "tests",
  "apps/api/tests",
  "apps/worker/tests",
  "packages/analysis/tests",
  "packages/confidence/tests",
  "packages/graph/tests",
  "packages/github/tests",
  "packages/intent/tests",
  "packages/parser/tests",
  "packages/repository/tests",
  "packages/shared/tests",
  "packages/testing/tests",
]


[tool.coverage.run]
source = ["apps", "packages"]
branch = false
omit = [
  "*/tests/*",
  "*/conftest.py",
  "*/__pycache__/*",
  "apps/dashboard/*",
]

[tool.coverage.report]
show_missing = false
skip_empty = true
