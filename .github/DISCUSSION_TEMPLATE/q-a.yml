title: "[Q&A]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask how to use Radius. For bugs, use an issue. Never post secrets or private code.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, config and what you read (docs/README) so far.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: false
