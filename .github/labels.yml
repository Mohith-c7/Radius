# Label taxonomy for issues and pull requests.
# Format: list of {name, color (6 hex, no #), description (max 100 chars)}.
# Compatible with label-sync tools (for example EndBug/label-sync or
# crazy-max/ghaction-github-labeler). No sync workflow is installed yet; until
# then the owner can apply it once (see docs/production-readiness/OWNER_ACTIONS.md).

# --- type ---
- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken or behaves incorrectly"
- name: "type: feature"
  color: "a2eeef"
  description: "New capability or enhancement"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: verdict"
  color: "b60205"
  description: "Wrong verdict: false positive or false negative"
- name: "type: proposal"
  color: "5319e7"
  description: "Rule or extractor proposal"
- name: "type: chore"
  color: "ededed"
  description: "Maintenance, refactor, tooling or dependencies"
- name: "type: security"
  color: "ee0701"
  description: "Security-related (never use for undisclosed vulnerabilities)"
- name: "type: question"
  color: "d876e3"
  description: "Usage question; prefer Discussions"

# --- area ---
- name: "area: api"
  color: "c5def5"
  description: "FastAPI service (apps/api)"
- name: "area: worker"
  color: "c5def5"
  description: "Analysis worker and job queue (apps/worker)"
- name: "area: dashboard"
  color: "c5def5"
  description: "Next.js dashboard (apps/dashboard)"
- name: "area: parser"
  color: "c5def5"
  description: "Language parsers and extractors"
- name: "area: graph"
  color: "c5def5"
  description: "Code property graph, slicing, module resolution"
- name: "area: intent"
  color: "c5def5"
  description: "Intent criteria extraction and snapshots"
- name: "area: confidence"
  color: "c5def5"
  description: "Verdict and confidence scoring"
- name: "area: testing"
  color: "c5def5"
  description: "Test selection and CI report ingestion"
- name: "area: github"
  color: "c5def5"
  description: "GitHub App, Check Runs, PR comments"
- name: "area: sandbox"
  color: "c5def5"
  description: "Execution isolation and sandbox"
- name: "area: benchmarks"
  color: "c5def5"
  description: "Benchmarks, fixtures and datasets"
- name: "area: ci"
  color: "c5def5"
  description: "Workflows and build tooling"
- name: "area: infra"
  color: "c5def5"
  description: "Docker, compose, migrations, deployment"
- name: "area: docs"
  color: "c5def5"
  description: "Documentation and community files"
- name: "area: security"
  color: "c5def5"
  description: "Security hardening, scanning, supply chain"

# --- priority ---
- name: "priority: critical"
  color: "b60205"
  description: "Drop everything: data exposure, sandbox escape, broken release"
- name: "priority: high"
  color: "d93f0b"
  description: "Important; plan for the current milestone"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# --- status ---
- name: "status: needs-triage"
  color: "ffffff"
  description: "Not yet reviewed by a maintainer"
- name: "status: needs-info"
  color: "fef2c0"
  description: "Waiting for more information from the reporter"
- name: "status: confirmed"
  color: "0e8a16"
  description: "Reproduced or accepted"
- name: "status: in-progress"
  color: "1d76db"
  description: "Someone is working on it"
- name: "status: blocked"
  color: "e99695"
  description: "Blocked by another task or a decision"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "status: wontfix"
  color: "cfd3d7"
  description: "Will not be worked on"

# --- community ---
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would welcome a contribution"
- name: "breaking change"
  color: "b60205"
  description: "Changes public behavior or an API contract"
