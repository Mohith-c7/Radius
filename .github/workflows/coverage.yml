name: Coverage

# Python line coverage with a minimum threshold (see docs/security/CI_CHECKS.md).
# Separate from CI so the required "Validate" check is unaffected.
on:
  pull_request:
  push:
    branches:
      - develop
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Measured baseline: 86% (local Windows run; 4 Docker/path tests failed there,
  # which lowers it). Threshold sits below that to absorb noise. Raise, never lower.
  COVERAGE_MIN: "83"

jobs:
  python-coverage:
    name: Python coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radius
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radius -d radius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://radius:radius@localhost:5432/radius
      # RADIUS_ENV is deliberately unset: package tests assert the default
      # (development) environment and fail if it is forced to "test".
      STORAGE_BACKEND: sql

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pytest-cov==7.1.0"

      - name: Build sandbox test image
        run: |
          printf 'FROM mirror.gcr.io/library/python:3.12-slim\nRUN pip install --no-cache-dir pytest==9.2.0\n' \
            | docker build -t radius-sandbox-test:latest -

      - name: Test with coverage
        run: >-
          python -m pytest apps/api/tests apps/worker/tests packages/*/tests tests
          --cov --cov-report=term --cov-report=xml:coverage.xml
          --cov-fail-under=${{ env.COVERAGE_MIN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
