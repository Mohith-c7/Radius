name: Dependency Review

# Needs the repository "Dependency graph" enabled (always on for public repos).
on:
  pull_request:
    branches: [develop, dev, main]

permissions: read-all

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to post the summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # Mirrors scripts/ci/license_check.py: deny AGPL/SSPL/GPL. LGPL and
          # MPL are intentionally not listed (psycopg is LGPL-3.0; a sharp
          # transitive dependency is Apache-2.0 AND LGPL-3.0-or-later).
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            SSPL-1.0, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only,
            GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          # Fork PRs get a read-only token and cannot comment; the job summary
          # always carries the report.
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'on-failure' || 'never' }}
