name: Stack

# Boots the real Docker Compose stack (postgres, migrations, api, worker, dashboard) and drives
# the dashboard in a browser. It exists because some bugs only appear when the product is run:
# an image that crashes on import, a Compose wiring mistake, a page that errors in a browser.
# No secrets: .env is generated with random local-dev values (scripts/gen_dev_env.py).
# See docs/security/CI_CHECKS.md.
on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: stack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stack:
    name: Stack boot + browser (verdict v2 ${{ matrix.verdict_v2 }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # "on" exercises the Verdict v2 import path in the API and the worker.
        verdict_v2: ["off", "on"]

    env:
      # A shell variable wins over .env in Compose interpolation.
      RADIUS_FEATURE_VERDICT_V2: ${{ matrix.verdict_v2 }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate .env with random local-dev secrets
        run: python3 scripts/gen_dev_env.py

      - name: Validate the Compose configuration
        run: docker compose config -q

      - name: Build images (api, worker, migrations, dashboard)
        timeout-minutes: 15
        run: docker compose build

      - name: Start the stack and wait until it is healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check services, endpoints and worker log after a 60 s stability window
        run: python3 scripts/ci/check_stack.py --stability-seconds 60

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload browser test output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-verdict-v2-${{ matrix.verdict_v2 }}
          path: |
            e2e/screenshots
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > stack-logs.txt 2>&1 || true
          tail -n 200 stack-logs.txt

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-verdict-v2-${{ matrix.verdict_v2 }}
          path: stack-logs.txt
          retention-days: 7

      - name: Tear down (containers, networks and volumes)
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
