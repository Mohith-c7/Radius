name: CI

on:
  pull_request:
  push:
    # Promotion flow: develop (daily work) -> dev (UAT) -> main (production).
    branches:
      - develop
      - dev
      - main

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on pull requests; never cancel runs on the
# protected branches (develop/dev/main) so every promoted commit gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radius
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radius -d radius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://radius:radius@localhost:5432/radius
      RADIUS_ENV: test
      STORAGE_BACKEND: sql
      RADIUS_REQUIRE_SANDBOX_TESTS: "true"
      NEXT_PUBLIC_RADIUS_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_RADIUS_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
      PYTHONPATH: apps/api/src:apps/worker/src:packages/analysis/src:packages/confidence/src:packages/graph/src:packages/parser/src:packages/repository/src:packages/shared/src:packages/testing/src:packages/github/src:packages/intent/src:packages/linking/src:packages/evidence/src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build sandbox test image
        # Lets the real-container isolation tests in
        # packages/testing/tests/test_sandbox_runner.py run instead of skipping.
        run: |
          printf 'FROM mirror.gcr.io/library/python:3.12-slim\nRUN pip install --no-cache-dir pytest==9.2.0\n' \
            | docker build -t radius-sandbox-test:latest -

      - name: Lint
        run: pnpm lint

      - name: Import contracts (intent domain purity)
        run: lint-imports --config packages/intent/.importlinter

      - name: Import contracts (linking domain purity)
        run: lint-imports --config packages/linking/.importlinter

      - name: Import contracts (evidence domain purity, verdict v2 boundaries)
        run: lint-imports --config packages/evidence/.importlinter

      - name: Import contracts (calibration toolkit purity, not wired into the verdict)
        run: lint-imports --config packages/confidence/.importlinter

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # PLACEHOLDER (F-13 / F-07): once the adversarial sandbox suite from F-07
      # lands, add its step here (and keep it in this job so the required
      # `Validate` check covers it). Intentionally not enabled: the files it
      # depends on do not exist yet.
      #
      # - name: Sandbox adversarial suite
      #   run: python -m pytest packages/testing/tests/<adversarial suite path> -q

      - name: Root end-to-end tests
        run: python -m pytest tests -q

      - name: Build
        run: pnpm build

      - name: Migration sanity
        run: alembic upgrade head
